name: Test code

on:
    pull_request:
        branches:
            - master
            - Nightly
    push:
        branches:
            - master

jobs:
  Test:
      name: Check & Test
      runs-on: ubuntu-latest

      steps:
            - name: Checkout repository
              uses: actions/checkout@v3
            
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                components:
                    clippy, fmt

            - name: Format checking
              run: cargo fmt --all -- --check
            
            - name: Lint with Clippy
              run: cargo clippy -- -D warnings
            
            - name: Check code
              run: cargo check --all-features --all-targets
        
  build:
      name: Build Code (macOS, Windows and Linux)
      needs: Test
      strategy:
        matrix:
          include:
            - os: ubuntu-latest
              compiler_os: x86_64-unknown-linux-gnu
            - os: windows-latest
              compiler_os: x86_64-pc-windows-msvc
            - os: macos-latest
              compiler_os: x86_64-apple-darwin
      
      runs-on: ${{ matrix.os }}
      steps:
          - name: Checkout repository
            uses: actions/checkout@v3
          
          - name: Install Rust
            uses: dtolnay/rust-toolchain@stable
            with:
              targets: ${{ matrix.compiler_os }}
          
          - name: Build
            run: cargo build --release --target=${{ matrix.compiler_os }}

          - name: Get latest tag
            id: tag
            uses: actions/github-script@v7
            with:
              script: |
                const tags = await github.rest.repos.listTags({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  per_page: 1
                });
                const latestTag = tags.data[0]?.name || 'no-tag';
                core.setOutput('latest', latestTag);
      
          - name: Upload Artifact
            uses: actions/upload-artifact@v3
            with:
              name: Natrix-Snapshot-${{ matrix.os }}-${{ steps.tag.outputs.latest }}
              path: target/${{ matrix.compiler_os }}/release/

          - name: Re-search Artifact
            if: failure()
            uses: actions/upload-artifact@v3
            with:
              name: Natrix-Snapshot-${{ steps.tag.outputs.latest }}-${{ matrix.os }}
              path: target/${{ matrix.compiler_os }}/release/
              