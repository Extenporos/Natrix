name: Nightly CI

on:
  push:
    branches:
      - Nightly

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build and create nightly release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check || true

      - name: Cargo check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings || true

      - name: Run tests
        run: cargo test --all-features || true

      - name: Build release
        run: cargo build --release

      - name: Create Nightly Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          release_name: "Nightly #${{ github.run_number }} - ${{ github.ref_name }}"
          body: |
            Nightly build from ${{ github.sha }} (branch ${{ github.ref_name }})
          draft: false
          prerelease: true
          target_commitish: ${{ github.sha }}

      - name: Upload binary to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target/release/natrix
          asset_name: natrix-nightly
          asset_content_type: application/octet-stream
          